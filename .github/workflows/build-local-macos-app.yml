name: Build Local macOS App

on:
  push:
    branches:
      - fix/macos-ime-ctrl-c-v

  workflow_dispatch:
    inputs:
      optimize:
        description: Zig optimization mode
        required: true
        default: ReleaseFast
        type: choice
        options:
          - ReleaseFast
          - ReleaseSafe
          - Debug

jobs:
  build:
    name: Build Ghostty.app
    runs-on: macos-26
    timeout-minutes: 120

    env:
      ZIG_LOCAL_CACHE_DIR: /Users/runner/zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /Users/runner/zig/global-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Select Xcode 26
        run: |
          set -euxo pipefail
          uname -m
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d /Applications/Xcode_26.4.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app
          elif [ -d /Applications/Xcode_26.5_beta_2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5_beta_2.app
          elif [ -d /Applications/Xcode_26.5.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install Metal Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx --find metal
          xcrun -sdk macosx --find metallib

      - name: Fetch Zig dependency cache
        id: deps
        run: |
          set -euxo pipefail
          nix build -L .#deps
          echo "path=$(readlink ./result)" >> "$GITHUB_OUTPUT"

      - name: Build GhosttyKit
        run: |
          set -euxo pipefail
          OPTIMIZE="${{ inputs.optimize }}"
          if [ -z "$OPTIMIZE" ]; then
            OPTIMIZE="ReleaseFast"
          fi
          nix develop -c zig build \
            --system "${{ steps.deps.outputs.path }}" \
            -Doptimize="$OPTIMIZE" \
            -Dxcframework-target=native \
            -Demit-macos-app=false

      - name: Build Ghostty.app
        run: |
          set -euxo pipefail
          cd macos
          xcodebuild \
            -target Ghostty \
            -configuration ReleaseLocal \
            -arch arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            COMPILATION_CACHE_CAS_PATH=/Users/runner/Library/Developer/Xcode/DerivedData/CompilationCache.noindex \
            COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES

      - name: Ad-hoc sign app
        run: |
          set -euxo pipefail
          test -d macos/build/ReleaseLocal/Ghostty.app
          /usr/bin/codesign --force --deep --sign - --entitlements macos/GhosttyReleaseLocal.entitlements macos/build/ReleaseLocal/Ghostty.app
          /usr/bin/codesign --verify --deep --strict --verbose=2 macos/build/ReleaseLocal/Ghostty.app

      - name: Package app
        run: |
          set -euxo pipefail
          ditto -c -k --keepParent macos/build/ReleaseLocal/Ghostty.app Ghostty-local-${{ github.sha }}.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-local-macos-app
          path: Ghostty-local-${{ github.sha }}.zip
          if-no-files-found: error
